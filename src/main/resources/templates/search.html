<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Petitions</title>
    <meta charset="UTF-8">
</head>
<body>
<h1 data-cy="search-page-title">Search Petitions</h1>

<form th:action="@{/search/results}" method="get" data-cy="search-form">
    <p>
        <label for="keyword">Keyword:</label>
        <input type="text" id="keyword" name="keyword" required data-cy="search-keyword-input">
    </p>
    <p>
        <button type="submit" data-cy="search-submit-button">Search</button>
    </p>
</form>

<p>
    <a th:href="@{/}">Home</a>
</p>

<p>
    <a th:href="@{/petitions}">Back to all petitions</a>
</p>
</body>
</html>
