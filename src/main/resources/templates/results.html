<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>
    <meta charset="UTF-8">
</head>
<body>
<h1 data-cy="results-page-title">Search Results</h1>

<p>
    Results for:
    <strong th:text="${keyword}" data-cy="search-keyword-value">keyword</strong>
</p>

<p th:if="${#lists.isEmpty(results)}" data-cy="no-results-message">
    No petitions found matching "<strong th:text="${keyword}">keyword</strong>".
</p>

<ul th:if="${not #lists.isEmpty(results)}" data-cy="results-list">
    <li th:each="petition : ${results}">
        <a th:href="@{/petition/{id}(id=${petition.id})}"
           th:text="${petition.title}"
           data-cy="result-link">Petition title</a>
    </li>
</ul>

<p>
    <a th:href="@{/}">Home</a>
</p>

<p>
    <a th:href="@{/search}">Back to search</a>
</p>

<p>
    <a th:href="@{/petitions}">Back to all petitions</a>
</p>
</body>
</html>
