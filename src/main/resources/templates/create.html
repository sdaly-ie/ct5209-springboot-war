<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Petition</title>
    <meta charset="UTF-8">
</head>
<body>
<h1 data-cy="create-page-title">Create a Petition</h1>

<form th:action="@{/create}" method="post" data-cy="create-form">
    <p>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required data-cy="petition-title-input">
    </p>

    <p>
        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="5" cols="40" required data-cy="petition-description-input"></textarea>
    </p>

    <p>
        <button type="submit" data-cy="create-petition-button">Create Petition</button>
    </p>
</form>

<p>
    <a th:href="@{/}">Home</a>
</p>

<p>
    <a th:href="@{/petitions}">Back to all petitions</a>
</p>
</body>
</html>
